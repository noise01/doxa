name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The static checks answer the same on every platform, so they run once. What
  # differs across platforms is what the code does when it runs, and that is the
  # `platforms` job below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Import contracts
        run: uv run lint-imports

      - name: Types
        run: uv run mypy

      # Measured here only. The platform jobs run the same suite and would report
      # the same number; the floor job runs it at the oldest dependencies, where a
      # difference would say something about those rather than about the tests.
      - name: Test
        run: uv run pytest --cov=endoxa

  # This package is developed on Windows and was tested only on Linux, which is
  # the wrong way round: the platform its author would hit a break on was the one
  # nothing checked. Text decoding is the concrete reason -- a file read without
  # an explicit encoding takes the locale's, and on Windows that is a legacy code
  # page rather than UTF-8.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras --dev

      - name: Test
        run: uv run pytest

  # A lower bound nothing installs is a number, not a claim. Resolution takes the
  # newest of everything by default, so `lark>=1.3.1` has never meant that 1.3.1
  # works -- only that someone typed it. This installs the oldest version each
  # direct dependency allows and runs the suite against that.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync at the declared lower bounds
        run: uv sync --all-extras --dev --resolution lowest-direct

      - name: What was installed
        run: uv pip list

      - name: Test
        run: uv run --no-sync pytest
