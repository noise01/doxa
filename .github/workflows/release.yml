name: Release

# A release is a tag, not a state of `main`: the version that goes out is a commit
# someone deliberately marked. The tag and the built version are checked against
# each other below, because PyPI refuses a second upload of a version it already
# has -- a mismatch caught after the fact cannot be corrected, only abandoned.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    # Named here and in the trusted publisher on PyPI. Both sides state it so that
    # neither a workflow moved into this repository nor a tag pushed to a fork can
    # reach the upload token.
    environment: pypi

    permissions:
      # Trusted publishing exchanges this short-lived token for an upload token at
      # PyPI. Nothing about the account is stored in this repository.
      id-token: write
      # To cut the GitHub release at the end.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras --dev

      # The same checks CI runs, repeated rather than assumed. A tag can point
      # at a commit CI never saw -- a rebase, a branch that was never pushed -- and
      # this is the one place where "it was green somewhere" does not undo itself.
      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Import contracts
        run: uv run lint-imports

      - name: Types
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: The tag and the built version agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built="$(basename dist/*.tar.gz .tar.gz)"
          built="${built#endoxa-}"
          if [ "$tagged" != "$built" ]; then
            echo "tag says ${tagged}, the package says ${built}" >&2
            exit 1
          fi

      # Before the upload, not after: a version with no entry is a version nobody
      # wrote down what changed in, and PyPI will not take the fix -- it refuses a
      # second upload of a version it already has.
      - name: The changelog has an entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            $0 == heading { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## [${version}]' section" >&2
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      # After the upload. A release announcing a version that is not on the index
      # sends readers somewhere they cannot install from.
      - name: Cut the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md dist/*
