[project]
name = "endoxa"
version = "0.6.1"
description = "Governed beliefs for LLM agents: an append-only ledger, SMT-checked consistency, defeasible revision, and calibration instruments."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "noise01" }]
keywords = [
    "agent",
    "belief-revision",
    "calibration",
    "llm",
    "smt",
    "truth-maintenance",
]
# No license classifier: PEP 639 forbids pairing one with a `license`
# expression, and the expression above is the authoritative statement.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The core -- ledger, revision, solver -- takes one dependency: the TPTP grammar
# the solver parses rules with. The two packages that need more are optional, so
# governing beliefs never drags in a model framework or a graph library.
dependencies = ["lark>=1.3.1"]

[project.optional-dependencies]
trace = ["pydantic>=2.12.5"]
coverage = ["networkx[default]>=3.6.1"]

[project.urls]
Homepage = "https://github.com/noise01/endoxa"
Changelog = "https://github.com/noise01/endoxa/blob/main/CHANGELOG.md"
Issues = "https://github.com/noise01/endoxa/issues"

[build-system]
requires = ["uv_build>=0.9.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.3",
    "mypy>=1.18",
    "pytest>=9.0.3",
    # The trace store is an async port, so its contract test needs an async runner.
    "pytest-asyncio>=1.3.0",
    # 6.0.3 is the first release with a wheel for this Python. Older ones fall
    # back to building from source and fail there, which the `floor` CI job
    # found the day this was added -- the bound below was written without
    # checking, and the job exists for exactly that.
    "pytest-cov>=7.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.17",
    # The solver's correctness is asserted against Z3 by differential tests, not
    # by its own test suite alone.
    "types-networkx>=3.6",
    "z3-solver>=4.13",
]

[tool.ruff]
target-version = "py314"
line-length = 120
# The generated wiki is not maintained code. ruff formats python blocks inside
# markdown, and those pages carry examples written to be read rather than to
# satisfy a formatter; reformatting a generator's output is a fight with the
# generator, which writes it again on the next run.
extend-exclude = ["openwiki"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter; trailing commas are its job
    # The Apache-2.0 grant is stated once, in LICENSE and NOTICE, rather than
    # repeated atop every file. Per-file headers are conventional for this
    # licence but not required by it, and a notice restated a few hundred times
    # is a few hundred places for it to drift out of agreement with itself.
    "CPY001",
    "D1",      # docstrings are required by review, not by lint
    "D413",    # no blank line after the last docstring section
    "PLR0911", # dispatch functions return early per branch
    # TC001/TC002/TC003 move an import used only in annotations into an
    # ``if TYPE_CHECKING`` block. That saves import time and costs the annotation:
    # with PEP 649 the name is looked up when something reads the annotations
    # back, and it is not there. It had left 26 of this package's 63 exported
    # symbols with signatures that raise NameError under ``get_type_hints``, which
    # is what ``py.typed`` and the Typing :: Typed classifier promise will work.
    # A test holds the promise; these three rules would undo it.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
    "INP001", # a directory of scripts is not a package
    "T201",   # printing is what an example is for
]
"tests/**/*.py" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "D400",
    "D415",
    "INP001",
    "PLR2004",
    "S101",
    "S311", # seeded pseudo-random generation is the point of the harness, not crypto
    "SLF001",
]

[tool.coverage.run]
source = ["src/endoxa"]
# Branch coverage, not line. A line that runs is not a line whose alternatives
# ran, and this package is mostly branches -- a solver, a revision preference, a
# fold with seven operations. The difference here is only two points, which is
# itself worth knowing.
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
# A ratchet against a drop worth noticing, not a lock on the figure. Two things
# keep it below what a run reports:
#
# - Part of the suite is a random sweep, so the number moves run to run. Measured
#   over four runs: 86.63, 87.41, 87.39, 87.39 -- a spread of 0.78. A floor set at
#   the number seen would fail on an unlucky Tuesday, which is how a ratchet earns
#   a reputation for noise and then gets deleted.
# - A refactor that moves the denominator by a statement is not a coverage
#   regression and should not read as one.
#
# So: below the low end of the observed range, not below the mean. Raise it when
# the range clears the next whole point; lowering it means writing down why.
fail_under = 85

[tool.mypy]
# Scoped to the shipped package. The tests carry deliberate looseness -- untyped
# fixtures, private access, planted violations -- and holding them to the same
# bar would mean annotating a harness rather than checking a library.
files = ["src/endoxa"]
strict = true
# strict turns on warn_unused_ignores, which is the half that matters most here:
# before this, two suppressions in `derive` were malformed and had been
# suppressing nothing, and a third named a checker that was not installed. A
# suppression nobody verifies is a claim nobody checks.

[tool.pytest.ini_options]
testpaths = ["tests"]
# The differential harness is a helper package under tests/, imported by the two
# tests that drive it; the repo root has to be importable for that to resolve.
pythonpath = ["."]
# strict-markers/strict-config: a mistyped marker or ini key must fail rather
# than be silently ignored -- a check that cannot fail is not a check.
addopts = ["--strict-markers", "--strict-config"]

[tool.importlinter]
root_package = "endoxa"

# The package is a DAG, and this states the whole of it: a layer may import the
# layers below it and never the ones above. Reading it bottom-up --
#
#   errors       the exceptions this package raises; depends on nothing, so that
#                every layer above may raise them.
#   syntax       parses an atom's shape; depends on nothing else.
#   solver       decides satisfiability; a frozen, self-contained SMT engine.
#   governance   decides what to do about beliefs, using both.
#   trace        records the series of thoughts; independent of the decision.
#   instruments  measures everything and is imported by nothing, because a
#                measure that its subject can reach is a measure its subject can
#                move.
#
# A new top-level package or module is not in this list and would escape the rule
# in silence, so the port owes a completeness test that everything directly under
# `endoxa` appears here -- an enumeration without a check is an enumeration that
# rots.
[[tool.importlinter.contracts]]
name = "The package is a DAG"
type = "layers"
layers = [
    "endoxa.instruments",
    "endoxa.trace",
    "endoxa.governance",
    "endoxa.solver",
    "endoxa.syntax",
    "endoxa.errors",
]
